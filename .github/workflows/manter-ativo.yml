# Mantém o projeto Supabase (plano gratuito) ativo: ele é pausado depois de ~7 dias sem uso.
# A health sozinha não basta (não toca no banco); o `migration list` consulta o Postgres remoto.
# Agendamentos só rodam a partir da main, e o GitHub os desliga após 60 dias sem atividade no repo.
name: Manter ativo

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.119.0

      - name: Consulta o banco remoto
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase migration list

      - name: Health check remoto
        run: |
          url="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/health"
          curl -sS --max-time 10 --fail "$url"
