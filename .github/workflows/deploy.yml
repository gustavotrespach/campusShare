# Deploy do backend no projeto Supabase remoto: migrations (db push) e Edge Functions.
# Roda no merge na main (release develop → main) ou manualmente (Actions → Deploy → Run workflow).
# A config do Auth/SMTP (supabase config push) continua manual: precisa da chave do Resend,
# que não fica no GitHub (docs/SECURITY.md).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deploys em fila: nunca dois ao mesmo tempo e nunca um cancelando o outro no meio.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  testes:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: deploy
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.119.0

      - name: Confere os segredos
        run: |
          for nome in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!nome}" ]; then
              echo "::error::Segredo $nome não cadastrado (Settings → Secrets and variables → Actions)"
              exit 1
            fi
          done

      - name: Liga ao projeto remoto
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Migrations antes do deploy
        run: supabase migration list

      - name: Aplica migrations novas
        run: supabase db push --yes

      - name: Migrations depois do deploy (local = remoto)
        run: supabase migration list

      # Publica todas as pastas de supabase/functions (menos _shared), com o verify_jwt do config.toml
      - name: Publica as Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"

      - name: Health check remoto
        run: |
          url="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/health"
          for tentativa in 1 2 3 4 5; do
            corpo=$(curl -sS --max-time 10 -w '\n%{http_code}' "$url" || true)
            status=$(printf '%s' "$corpo" | tail -n1)
            json=$(printf '%s' "$corpo" | sed '$d')
            echo "health (tentativa $tentativa): HTTP $status $json"
            if [ "$status" = "200" ] && printf '%s' "$json" | jq -e '.status == "ok"' > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::health remota não respondeu 200 {\"status\":\"ok\"}"
          exit 1
